publisherName: Dacast
serviceCategory: Media and Streaming
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Purchase
  - Usage
  - Adjustment
focusColumns:
  ServiceName: Dacast Streaming Platform
  ServiceCategory: Media and Streaming
