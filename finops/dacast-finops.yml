meters:
- name: subscription
  description: Fixed monthly/annual plan fee bundling a bandwidth and storage allotment.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: overage_bandwidth
  description: Delivery bandwidth beyond the plan allotment, billed per GB (~$0.30/GB, pre-paid as low as $0.09/GB).
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
  - content
- name: overage_storage
  description: Stored video volume beyond the plan allotment, billed per GB per month (~$0.15/GB/mo).
  unit: gigabytes
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track bandwidth and storage burn against the plan allotment via the Dacast dashboard and analytics API before overages accrue.
- name: Allocation
  description: Attribute bandwidth and storage to content items / channels using per-content analytics to map to internal cost centers.
- name: Optimization
  description: Right-size the plan to expected traffic; pre-pay bandwidth (as low as $0.09/GB) instead of paying post-billed overage; prune unused VOD and renditions to cut storage.
- name: Accountability
  description: Assign an owner per account/plan and review bandwidth/storage against allotment monthly to avoid surprise overages.
maintainers:
