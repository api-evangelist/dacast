description: >-
  FinOps view of Dacast spend. Dacast bills a fixed monthly/annual subscription
  per plan (Starter, Event, Scale, Custom) that bundles a bandwidth and storage
  allotment, plus usage-based overage charges when bandwidth or storage exceed
  the allotment. API access is a plan entitlement (Scale and Custom), not a
  separately metered line item. Primary cost drivers are content delivery
  bandwidth and stored video volume.
notes: >-
  Subscription and overage rates are subject to change; verify against the Dacast
  pricing page during reconciliation.
sources:
- https://www.dacast.com/live-streaming-pricing-plans/
- https://calculator.dacast.com/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
