openapi: 3.2.0
info:
  title: Dacast Analytics API
  description: RESTful JSON API for the Dacast live streaming and video hosting (OTT) platform.
  version: '2.0'
  contact:
    name: Dacast Support
    url: https://www.dacast.com/support/
  termsOfService: https://www.dacast.com/terms-conditions/
servers:
- url: https://developer.dacast.com
security:
- ApiKeyAuth: []
tags:
- name: Analytics
  description: Viewer analytics and reporting.
paths:
  /v2/analytics:
    get:
      operationId: getAnalytics
      tags:
      - Analytics
      summary: Read viewer analytics
      description: Read raw viewer analytics (views, watch time, bandwidth, geography) for VOD and live content over a time range. Dacast documents analytics export via the API but does not publish the exact endpoint path or query parameters; this operation is modeled.
      x-modeled: true
      parameters:
      - name: contentId
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Analytics data.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
