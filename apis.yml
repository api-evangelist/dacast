name: Dacast
kind: company
description: Dacast is a unified live streaming and video hosting (OTT) platform that
  lets businesses broadcast live channels, host and monetize video on demand (VOD),
  organize content into playlists, and embed a white-label HTML5 player. Dacast
  exposes a RESTful JSON API (base https://developer.dacast.com/v2) for programmatically
  creating live channels, uploading and managing VOD, building playlists, and reading
  viewer analytics. API requests authenticate with an X-Api-Key header. API access
  is gated to Scale and Custom plans (trial accounts can request temporary access
  from sales), so the endpoints below are grounded in Dacast's public developer docs
  but several exact paths beyond the confirmed /v2/channel, /v2/vod, and /v2/playlist
  are honestly modeled.
